# Tests always run against the local Firestore emulator (never a real project).
pila.firestore.project-id=demo-pilamoremore-test
pila.firestore.emulator-host=${FIRESTORE_EMULATOR_HOST:127.0.0.1:8085}
pila.demo.enabled=true
pila.google.client-id=test-client
# Fake shop keys (32 / 16 chars). The base URL is a closed port so no test ever reaches NewebPay.
pila.newebpay.merchant-id=MS_TEST
pila.newebpay.hash-key=0123456789abcdef0123456789abcdef
pila.newebpay.hash-iv=fedcba9876543210
pila.newebpay.base-url=http://127.0.0.1:9
# Per-IP limits are unit-tested (AuthRateLimiterTests); integration tests sign up many accounts from one address.
pila.ratelimit.enabled=false
pila.reminders.key=test-reminder-key
pila.admin.emails=boss@example.com
# Most tests sign up and go straight on; EmailVerificationTests turns this on.
pila.auth.verify-email=false
