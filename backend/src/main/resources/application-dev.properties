# Local development profile (applied automatically by `./mvnw spring-boot:run`, never in the packaged jar).
pila.firestore.emulator-host=${FIRESTORE_EMULATOR_HOST:127.0.0.1:8085}
pila.demo.enabled=${PILA_DEMO_ENABLED:true}
# Google sign-in: set GOOGLE_CLIENT_ID to the pilamoremore project's OAuth client ID (Web application). Unset = Google sign-in off.
pila.google.client-id=${GOOGLE_CLIENT_ID:}
# No mail provider locally: reset links are printed in the backend log.
pila.mail.log-body=true
