spring.application.name=pilamoremore-backend
server.port=${PORT:8080}

# --- Firestore ---
# Local dev / tests: run the Firebase emulator (see README) and set FIRESTORE_EMULATOR_HOST=127.0.0.1:8085.
# Production: leave the emulator host empty; credentials come from Application Default Credentials.
pila.firestore.project-id=${GOOGLE_CLOUD_PROJECT:demo-pilamoremore}
pila.firestore.database-id=${FIRESTORE_DATABASE_ID:(default)}
pila.firestore.emulator-host=${FIRESTORE_EMULATOR_HOST:}

# --- Auth ---
# HS256 signing secret (>= 32 bytes). MUST be overridden in production via PILA_JWT_SECRET.
pila.jwt.secret=${PILA_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
pila.jwt.ttl-hours=${PILA_JWT_TTL_HOURS:168}

# --- CORS: comma-separated frontend origins ---
pila.cors.allowed-origins=${PILA_CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# --- Demo mode: enables /api/demo/* (data import/reset) and the demo coach account. Never enable in production. ---
pila.demo.enabled=${PILA_DEMO_ENABLED:false}
pila.demo.password=${PILA_DEMO_PASSWORD:demo1234}

# --- Public URLs: where NewebPay sends the browser back (the app) and posts results (this API). ---
pila.app-url=${PILA_APP_URL:http://localhost:5173}
# New password sign-ups must open a mailed link before using the app (needs mail configured to work).
pila.auth.verify-email=${PILA_VERIFY_EMAIL:true}
pila.api-url=${PILA_API_URL:http://localhost:8080/api}

# --- Google sign-in: the OAuth client ID (Web application) from Google Cloud Console. Empty = off. ---
pila.google.client-id=${GOOGLE_CLIENT_ID:}
# The iOS app's OAuth client (its ID tokens are for this audience). Empty = sign-in from the app is refused.
pila.google.ios-client-id=${GOOGLE_IOS_CLIENT_ID:}
# Sign in with Apple: identity tokens are issued for the iOS app's bundle ID.
pila.apple.bundle-id=${APPLE_BUNDLE_ID:com.pilamoremore.app}
# Revoking Sign in with Apple when an account is deleted (a Sign in with Apple key from the Apple Developer site). Empty = off.
pila.apple.team-id=${APPLE_TEAM_ID:}
pila.apple.key-id=${APPLE_KEY_ID:}
pila.apple.private-key=${APPLE_PRIVATE_KEY:}
# In-app purchases: the app's numeric Apple ID (App Store Connect > App Information). Empty = only Sandbox purchases are accepted.
pila.apple.app-id=${APPLE_APP_ID:}

# --- NewebPay (藍新金流). Empty = online payment off. Sandbox: https://ccore.newebpay.com, live: https://core.newebpay.com ---
pila.newebpay.merchant-id=${NEWEBPAY_MERCHANT_ID:}
pila.newebpay.hash-key=${NEWEBPAY_HASH_KEY:}
pila.newebpay.hash-iv=${NEWEBPAY_HASH_IV:}
pila.newebpay.base-url=${NEWEBPAY_BASE_URL:https://ccore.newebpay.com}
# Testing only: new subscriptions are charged every N days (2–999) instead of monthly. Leave unset in production.
pila.newebpay.period-days=${NEWEBPAY_PERIOD_DAYS:0}

# --- Email (password resets) via Resend. Empty key = nothing is sent (the message is only logged). ---
pila.mail.resend-api-key=${PILA_RESEND_API_KEY:}
pila.mail.from=${PILA_MAIL_FROM:Pila More More <noreply@pilamoremore.com>}
# Log the whole message (including reset links) when no key is set. Local development only.
pila.mail.log-body=${PILA_MAIL_LOG_BODY:false}

# --- Class reminders: Web Push (VAPID) keys, raw base64url P-256 (65-byte public point, 32-byte private scalar). Empty = no push;
# people then get the email fallback (when they can sign in and haven't turned it off).
pila.push.public-key=${PILA_PUSH_PUBLIC_KEY:}
pila.push.private-key=${PILA_PUSH_PRIVATE_KEY:}
# Shared key Cloud Scheduler sends to POST /api/internal/reminders (X-Reminder-Key). Empty = that endpoint is off.
pila.reminders.key=${PILA_REMINDER_KEY:}

# --- Admin page: emails (comma-separated) of the service owner(s). They must sign in with an email they've proven
# (Google, or a reset link). Empty = no admin page.
pila.admin.emails=${PILA_ADMIN_EMAILS:}
